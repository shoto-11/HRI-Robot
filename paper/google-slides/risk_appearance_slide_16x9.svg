<text x="80" y="125" font-family="Meiryo, Yu Gothic, sans-serif" font-size="22" fill="#5a5a5a">R = min(1, 0.55Rp+0.30Rc+0.15Rd)　→　RiskToVisualMapper　／　Rfloor なし　／　PTTC は相対速度</text>
<text x="80" y="160" font-family="Meiryo, Yu Gothic, sans-serif" font-size="22" fill="#5a5a5a">α = 0.35 + 0.65R　　H = (1−R)×180°　　S = 0.4+0.6R　　V = 0.5+0.3R　　／　表示は d≤13.6 m のみ</text>
